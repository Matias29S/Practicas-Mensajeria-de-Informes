<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión · Escuela Técnica N° 35</title>
<meta name="description" content="Iniciar sesión en el sistema de informes de conducta de la Escuela Técnica N° 35 D.E. 18 Ing. Eduardo Latzina.">
<meta name="theme-color" content="#b3121f">
<link rel="icon" href="img/escudo.png">
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/auth.css">
</head><body class="auth">
<div class="banda" aria-hidden="true"></div>
<main class="tarjeta">
  <img class="escudo" src="img/escudo.png" alt="Escudo de la Escuela Técnica N° 35 D.E. 18 Ing. Eduardo Latzina">
  <h1>Iniciar sesión</h1>
  <p class="portal" id="portal"></p>
  <form id="f">
    <p id="exito" class="exito" role="status" hidden><strong>¡Cuenta creada correctamente!</strong> Ingresá tu contraseña para entrar.</p>
    <div class="campo">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <div class="clave">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="ojo" aria-label="Mostrar contraseña" data-ojo="password">Mostrar</button>
      </div>
    </div>
    <p id="err" class="err" role="alert" hidden></p>
    <button class="btn grande" type="submit">Iniciar sesión</button>
  </form>
  <div id="extra"></div>
  <p class="pie"><a href="index.html">← Volver al inicio</a></p>
</main>
<script src="js/store.js"></script><script src="js/login.js"></script>
</body></html>
